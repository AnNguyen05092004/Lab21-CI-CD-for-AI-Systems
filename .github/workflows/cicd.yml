# =============================================================================
# .github/workflows/cicd.yml - Pipeline CI/CD cho mô hình dự đoán thu nhập
#
# Vai trò của file trong hệ thống:
#   Mỗi lần bạn `git push` lên nhánh main và có thay đổi ở dữ liệu (file .dvc),
#   mã nguồn (src/*.py) hoặc siêu tham số (params.yaml), GitHub tự chạy 4 job
#   nối tiếp nhau:
#       Unit Test -> Train -> Quality Gate -> Release
#   Job sau chỉ chạy nếu job trước THÀNH CÔNG (nhờ khai báo `needs`).
# =============================================================================
name: Income Model CI/CD

# Tên hiển thị của mỗi lần chạy = nội dung commit message, để dễ phân biệt
# lần chạy của Bước 2 (commit code) với lần chạy của Bước 3 (commit dữ liệu).
run-name: ${{ github.event.head_commit.message || 'Chạy thủ công' }}

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chạy các bài kiểm tra trên dữ liệu giả (không cần kết nối cloud storage).
  # Nếu có test thất bại, pipeline dừng ngay tại đây.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Chạy unit test
        run: python -m pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xác thực với cloud, kéo dữ liệu bằng DVC, huấn luyện, tải model lên bucket.
  # Chỉ chạy khi Job 1 (Unit Test) thành công.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    # Khai báo "đầu ra" của job để job quality-gate đọc được giá trị f1
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Xác thực với Cloud Storage
        # Secret được truyền qua biến môi trường rồi ghi ra file tạm.
        # Dùng printf '%s' để ghi nguyên văn, không để shell biến đổi ký tự.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          printf '%s' "$STORAGE_CREDENTIALS" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> "$GITHUB_ENV"

      - name: Kéo dữ liệu bằng DVC
        # File .dvc trong git trỏ credentialpath tới sa-key.json trên máy bạn
        # (không tồn tại trên runner). Lệnh --local ghi đè đường dẫn đó chỉ cho
        # runner này, rồi chỉ kéo 2 file cần thiết (không cần train_batch2).
        run: |
          dvc remote modify --local labstore credentialpath /tmp/sa-key.json
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Huấn luyện mô hình
        run: python src/train.py

      - name: Đọc báo cáo
        id: read_report
        # Lấy f1_score từ outputs/report.json rồi ghi vào GITHUB_OUTPUT
        # để job quality-gate đọc được qua needs.train.outputs.f1
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          echo "F1 của lần huấn luyện này: $F1"

      - name: Tải model lên Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          # Tự đọc key từ biến GOOGLE_APPLICATION_CREDENTIALS đã đặt ở bước xác thực
          client = storage.Client()
          bucket = client.bucket(os.environ["ARTIFACT_BUCKET"])
          blob = bucket.blob("artifacts/current/model.joblib")
          blob.upload_from_filename("models/model.joblib")
          print(f"Đã tải model lên gs://{bucket.name}/{blob.name}")
          PYEOF

      - name: Lưu báo cáo thành artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE (cổng chất lượng)
  # Chỉ cho đi tiếp nếu f1_score >= 0.65.
  #
  # Lưu ý: ngưỡng đặt trên f1_score chứ KHÔNG phải accuracy. Dữ liệu có tỷ lệ
  # lớp 75/25, nên một mô hình đoán bừa "thu nhập thấp" cho mọi người vẫn đạt
  # accuracy 0.75 mà hoàn toàn vô dụng.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Kiểm tra ngưỡng chất lượng
        # Output của GitHub Actions luôn là CHUỖI, nên phải ép sang số thực
        # bằng float() trước khi so sánh.
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python3 - <<'PYEOF'
          import os

          NGUONG_F1 = 0.65
          f1 = float(os.environ["F1"])

          # SystemExit với một chuỗi sẽ in chuỗi đó rồi thoát với mã lỗi 1,
          # khiến job (và cả pipeline phía sau) chuyển sang màu đỏ.
          if f1 < NGUONG_F1:
              raise SystemExit(f"THẤT BẠI: f1_score {f1:.4f} < {NGUONG_F1}. Hủy triển khai.")
          print(f"ĐẠT: f1_score {f1:.4f} >= {NGUONG_F1}. Tiếp tục triển khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # SSH vào VM, khởi động lại dịch vụ để nạp model mới, rồi kiểm tra sức khỏe.
  # Chỉ chạy khi Job 3 (Quality Gate) thành công.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: Triển khai lên VM qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Khởi động lại dịch vụ: khi khởi động, serve.py sẽ tải model mới nhất
            sudo systemctl restart income-api
            sleep 5

            # Hỏi /healthz tối đa 6 lần, mỗi lần cách nhau 5 giây
            for lan in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check thành công ở lần thử thứ $lan."
                exit 0
              fi
              echo "Lần thử $lan thất bại, chờ 5 giây rồi thử lại..."
              sleep 5
            done

            echo "Health check thất bại sau 6 lần thử."
            exit 1
